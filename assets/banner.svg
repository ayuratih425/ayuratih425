<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#1c2129"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" fill="url(#panel)" rx="8"/>

  <!-- grid halus -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.35">
    <line x1="0" y1="55"  x2="900" y2="55"/>
    <line x1="0" y1="110" x2="900" y2="110"/>
    <line x1="0" y1="165" x2="900" y2="165"/>
    <line x1="225" y1="0" x2="225" y2="220"/>
    <line x1="450" y1="0" x2="450" y2="220"/>
    <line x1="675" y1="0" x2="675" y2="220"/>
  </g>

  <!-- aksen sudut -->
  <polyline points="14,44 14,14 44,14" fill="none" stroke="#2f81f7" stroke-width="1.5"/>
  <polyline points="856,14 886,14 886,44" fill="none" stroke="#2f81f7" stroke-width="1.5"/>
  <polyline points="14,176 14,206 44,206" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <polyline points="856,206 886,206 886,176" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- nama -->
  <text x="450" y="92" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif"
    font-size="46" font-weight="600" letter-spacing="7" fill="#e6edf3">AYURATIH</text>

  <!-- garis aksen -->
  <rect x="400" y="108" width="100" height="2" fill="#2f81f7"/>

  <!-- subtitle -->
  <text x="450" y="142" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif"
    font-size="14" letter-spacing="3.5" fill="#8b949e">DATA ANALYST &amp; PYTHON DEVELOPER</text>

  <!-- baris bawah -->
  <text x="450" y="180" text-anchor="middle" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif"
    font-size="12.5" letter-spacing="1" fill="#58a6ff">Open to collaboration and open-source contributions</text>
</svg>
