name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Coding Activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/coding.svg
          base: ""
          config: |
            template: professional
            config_timezone: Asia/Jakarta
            theme:
              background: "#161b22"
              color: "#e6edf3"
              metric: "#58a6ff"
              icon: "#2f81f7"
              value: "#e6edf3"
              label: "#8b949e"
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8

      - name: Activity
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/activity.svg
          base: ""
          config: |
            template: professional
            config_timezone: Asia/Jakarta
            theme:
              background: "#161b22"
              color: "#e6edf3"
              metric: "#58a6ff"
              icon: "#2f81f7"
              value: "#e6edf3"
              label: "#8b949e"
          plugin_activity: yes
          plugin_activity_limit: 5

      - name: Repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/repositories.svg
          base: repositories
          config: |
            template: professional
            config_timezone: Asia/Jakarta
            theme:
              background: "#161b22"
              color: "#e6edf3"
              metric: "#58a6ff"
              icon: "#2f81f7"
              value: "#e6edf3"
              label: "#8b949e"

      - name: Stars
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics/stars.svg
          base: ""
          config: |
            template: professional
            config_timezone: Asia/Jakarta
            theme:
              background: "#161b22"
              color: "#e6edf3"
              metric: "#58a6ff"
              icon: "#2f81f7"
              value: "#e6edf3"
              label: "#8b949e"
          plugin_stars: yes
          plugin_stars_limit: 4
